name: Trade Scan

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the within_scan_tolerance time-of-day guard for on-demand testing (weekday/holiday guards still apply). Never used for scheduled runs."
        type: boolean
        default: false
  schedule:
    # Targets: 6:00 AM PT premarket (13:00 UTC PDY / 14:00 UTC PST) and
    # 12:30 PM PT preclose (19:30 UTC PDT / 20:30 UTC PST).
    #
    # Fired 45 min early, off the :00/:30 marks: GitHub Actions queues
    # scheduled runs at those popular slots under heavy load and routinely
    # delays them 50min-2h+ (observed in run history), which blew past the
    # old +/-20min tolerance every single day. Firing early at an off-peak
    # minute plus a wider config.SCAN_TOLERANCE_MINUTES (90) absorbs that
    # jitter instead of fighting it. within_scan_tolerance() (main.py) still
    # filters out whichever DST-offset entry doesn't apply.
    - cron: '15 12,13 * * 1-5'
    - cron: '45 18,19 * * 1-5'
    # Target: 1:15 PM PT (20:15 UTC PDT / 21:15 UTC PST) for daily report.
    # Fired ~35 min early at off-peak minute to mitigate GitHub Actions queue
    # delays on popular :15 mark. Matched against config.DAILY_REPORT_TIME_PT
    # and DAILY_REPORT_TOLERANCE_MINUTES (main.py's within_daily_report_tolerance),
    # not SCAN_TIMES_PT.
    - cron: '40 19,20 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      CI: true
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan or daily report
        # force_run only exists on the workflow_dispatch input schema, so this
        # is false for every schedule-triggered run regardless of the
        # event_name check -- the check is kept explicit anyway so a manual
        # dispatch with force_run left at its default (false) behaves
        # identically to a real scheduled run.
        run: |
          if [ "${{ github.event.schedule }}" = "40 19,20 * * 1-5" ]; then
            python main.py --daily-report
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_run }}" = "true" ]; then
            python main.py --force-run
          else
            python main.py
          fi

      - name: Commit updated journal.json
        run: |
          git config user.name "trade-scanner-bot"
          git config user.email "actions@github.com"
          if [ -f journal.json ]; then
            git add -f journal.json
            git diff --cached --quiet || git commit -m "Update journal.json [skip ci]"
            git push
          else
            echo "journal.json not present this run (scan likely exited early via a guard); nothing to commit."
          fi
